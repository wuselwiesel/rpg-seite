<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Verkaufsbild Studio</title>
  <meta name="description" content="Aus einem Foto ein Verkaufsbild im Tise-Stil machen und als PNG speichern.">
  <meta name="theme-color" content="#131211">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&family=Bodoni+Moda:wght@400;500&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Chewy&family=DM+Sans:wght@400;500;600;700&family=Pacifico&family=Roboto+Slab:wght@800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Verkaufsbild Studio</h1>
    <p class="sub">Foto hochladen, Schrift und Farben wählen, als PNG speichern. Das Bild hat das Format 4:5 (1080 × 1350).</p>
  </header>

  <main class="grid">
    <section class="stage" aria-label="Vorschau">
      <canvas id="cv" width="1080" height="1350" role="img" aria-label="Vorschau des Verkaufsbilds"></canvas>
      <p class="hint">Bild ziehen, um den Ausschnitt zu ändern</p>
      <div class="actions">
        <button class="btn primary" id="save" type="button" disabled>Als PNG speichern</button>
        <button class="btn" id="share" type="button" hidden>Teilen</button>
      </div>
      <p class="hint" id="hint">Das ist ein Beispielfoto. Lade dein eigenes Foto hoch, dann kannst du speichern.</p>
    </section>

    <section class="panel" aria-label="Einstellungen">
      <div class="sec">
        <h2>Foto</h2>
        <label class="drop" id="drop">
          <strong>Foto auswählen oder hierher ziehen</strong>
          <span id="fname">JPG, PNG oder WebP</span>
          <input type="file" id="file" accept="image/*">
        </label>
        <div class="sliders"><label for="zoom">Zoom <input type="range" id="zoom" min="1" max="3" step="0.01" value="1"></label></div>
      </div>

      <div class="sec">
        <h2>Schrift</h2>
        <div class="seg" id="fonts"></div>
      </div>

      <div class="sec">
        <h2>Farben</h2>
        <div class="swatches" id="cols"></div>
        <div class="pickers">
          <label for="ct">Text <input type="color" id="ct" value="#f6efe4"></label>
          <label for="cg">Verlauf <input type="color" id="cg" value="#000000"></label>
        </div>
      </div>

      <div class="sec">
        <h2>Text</h2>
        <div class="fields">
          <label class="full" for="title">Titel <input type="text" id="title" maxlength="50" value="Weisses Kleid"></label>
          <label for="size">Größe <input type="text" id="size" maxlength="14" value="L"></label>
          <label for="price">Preis in € <input type="text" id="price" maxlength="7" inputmode="decimal" value="15"></label>
          <label class="full" for="extra">Zusatz, zum Beispiel Marke (optional) <input type="text" id="extra" maxlength="24"></label>
          <label class="full" for="shop">Name oben links (optional) <input type="text" id="shop" maxlength="20"></label>
        </div>
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast" hidden role="status"></div>
<script src="app.js"></script>
</body>
</html>
