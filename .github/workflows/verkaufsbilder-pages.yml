name: Verkaufsbild Studio veröffentlichen

# Stellt den Ordner verkaufsbilder/ als eigene Webseite auf GitHub Pages bereit.
# Läuft, sobald dort etwas auf main geändert wird, und lässt sich auch von Hand starten.
on:
  push:
    branches: [main]
    paths:
      - "verkaufsbilder/**"
      - ".github/workflows/verkaufsbilder-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: verkaufsbilder
      - id: deployment
        uses: actions/deploy-pages@v4
